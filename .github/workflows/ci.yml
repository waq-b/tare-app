name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit tests plus every Storybook story as a browser test (render, play, axe in both themes).
      - run: npm test
      - run: npm run build-storybook -w @tare/ui
      # Every board and every DESIGN.md component has a story.
      - run: npm run check:stories
