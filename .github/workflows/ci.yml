name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The API's tests run against a real Postgres (throwaway databases, RLS included).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit tests plus every Storybook story as a browser test (render, play, axe in both themes).
      - run: npm test
      # The whole P0 loop in a real browser against the built PWA (e2e/p0.spec.ts).
      - run: npm run e2e -w @tare/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: apps/web/test-results/
      - run: npm run build-storybook -w @tare/ui
      # Every board and every DESIGN.md component has a story.
      - run: npm run check:stories
